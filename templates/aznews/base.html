        <script>
            $(".pagination_number").click(function(e){
                e.preventDefault();
                let current_url = window.location.href.split('?')[0];
                let params = new URL(document.location).searchParams;
                let query = params.get("query");
                let href = $(this).attr('href');

                let new_url = `${current_url}${href}&query=${query}`;
                window.location.replace(new_url);
            });
        </script>




        <script>
            $("#newsletter_side_form2").submit(function(e)
        {

            let serializedData = $(this).serialize()

                    }, 5000);
                }
            })
        })

<script>
    const loginBtn = document.getElementById('loginBtn');
    const loginPopup = document.getElementById('loginPopup');
    const closeBtn = document.getElementById('closeBtn');

    loginBtn.addEventListener('click', function() {
        loginPopup.style.display = 'flex';
    });

    closeBtn.addEventListener('click', function() {
        loginPopup.style.display = 'none';
    });


    window.addEventListener('click', function(e) {
        if (e.target == loginPopup) {
            loginPopup.style.display = 'none';
        }
    });

    document.getElementById('popupLoginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        fetch("{% url 'login' %}", {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        }).then(response => response.json()).then(data => {
            const messageContainer = document.getElementById('popupLoginMessage');
            if (data.success) {
                messageContainer.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            } else {
                messageContainer.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
            }
        }).catch(error => console.error('Error:', error));
    });
</script>

<script>
    $(document).ready(function(){
        const weatherDiv = $('#weather');
        const latitude = 27.712017;
        const longitude = 85.312950;
        const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${85.312950}&current_weather=true`;

        $.ajax({
            url : apiUrl,
            method : "GET",

            success: function(data){
                console.log(data)
                if(data && data.current_weather){
                    weatherDiv.html(`Current Temperature: ${data.current_weather.temperature}°C`);
                }
                else
                {
                    weatherDiv.html("Unable to featch the data");
                }
            },
            error: function(){
                weatherDiv.html("Error fetching the data")
            }
        });
    });
</script>
