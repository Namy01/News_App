<aside class="single_sidebar_widget newsletter_widget">
    <h4 class="widget_title">Newsletter</h4>

    <div id = "newsletter_side_message">
        
    </div>

    <form action="" method="post" id="newsletter_side_form">
        {% csrf_token %}
        <div class="form-group">
            <input type="email" id="newsinput" name = "email" class="form-control" onfocus="this.placeholder = ''"
                onblur="this.placeholder = 'Enter email'" placeholder='Enter email' value = "" required >
        </div>
        <button class="button rounded-0 primary-bg text-white w-100 btn_1 boxed-btn"
            type="submit">Subscribe</button>
    </form>
</aside>
