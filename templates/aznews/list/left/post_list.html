{% for post in posts %}
<article class="blog_item">
    <div class="blog_item_img">
        <img class="card-img rounded-0" src="{{ post.featured_image.url }}" alt="{{ post.title }}">
        <a href="#" class="blog_item_date">
            <h3>{{ post.published_at|date:"j M" }}</h3>
            
        </a>
    </div>

    <div class="blog_details">
        <a class="d-inline-block" href="{% url 'post-detail' post.pk %}">
            <h2>{{ post.title }}</h2>
        </a>
        <p>{{ post.content|striptags|truncatewords:10 }}</p>
        <ul class="blog-info-link">
            <li><a href="#"><i class="fa fa-user"></i>{{ post.author.username }}</a></li>
            <li><a href="#"><i class="fa fa-tags"></i>{{ post.tag.all|join:", " }}</a></li>
            <li><a href="#"><i class="fa fa-paste"></i>{{ post.category.name|title }}</a></li>
            <li><a href="#"><i class="fa fa-eye"></i>{{ post.views_count }}</a></li>
            <li><a href="#"><i class="fa fa-comments"></i>{{ post.comment_set.count }}</a></li>
        </ul>
    </div>
</article>
{% endfor %}
